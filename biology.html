<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biology Facts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-header">
    <a href="index.html" class="back-link">&#8592; Back</a>
    <h2>Biology</h2>
  </div>

  <div class="fact-hero">
    <p>Fun fact of the day</p>
    <h1 style="color:#22c55e">Biology</h1>
  </div>

  <div class="fact-area">
    <div class="fact-box" id="fact-display">
      <span class="fact-badge" style="background:#22c55e">Biology</span>
      <h3 id="fact-title">Loading...</h3>
      <p id="fact-body"></p>
    </div>
    <button class="next-btn" style="background:#22c55e" onclick="nextFact()">
      Another fact &#8594;
    </button>
  </div>

  <script>
    const facts = [
      { title: "Your body has more bacterial cells than human cells", body: "For every one human cell in your body, there are roughly 1.3 bacterial cells living on and inside you. Most live in your gut and are essential for digestion, immunity, and overall health. You are more microbe than human by cell count." },
      { title: "The human brain generates enough electricity to power a small light bulb", body: "At any given moment, the electrical activity of neurons in your brain produces about 12–25 watts of power — enough to light a low-energy LED bulb. Your brain uses this power to process over 70,000 thoughts per day." },
      { title: "Octopuses have three hearts and blue blood", body: "An octopus has three hearts: two pump blood to the gills, one pumps it to the body. Their blood is blue because it uses haemocyanin — a copper-based molecule — instead of the iron-based haemoglobin that makes our blood red." },
      { title: "Trees communicate through underground fungal networks", body: "Forests are connected by vast networks of fungi called mycorrhizae that link tree roots. Trees share water, nutrients, and chemical warning signals through this 'wood wide web'. Older trees have been seen sending extra nutrients to struggling younger ones." },
      { title: "A human sneeze travels at around 160 km/h", body: "When you sneeze, air is expelled at speeds between 140 and 165 km/h, releasing thousands of tiny droplets. It is physically impossible to keep your eyes open during a sneeze — it is an automatic reflex." },
      { title: "Sharks are older than trees", body: "Sharks have existed for around 450 million years, while the oldest known trees evolved only about 350 million years ago. Sharks survived all five of Earth's mass extinction events, including the one that wiped out the dinosaurs." }
    ];
    let last = -1;
    function nextFact() {
      let i;
      do { i = Math.floor(Math.random() * facts.length); } while (i === last && facts.length > 1);
      last = i;
      const box = document.getElementById('fact-display');
      box.style.animation = 'none';
      box.offsetHeight;
      box.style.animation = 'fadeUp 0.5s ease both';
      document.getElementById('fact-title').textContent = facts[i].title;
      document.getElementById('fact-body').textContent = facts[i].body;
    }
    nextFact();
  </script>
</body>
</html>
